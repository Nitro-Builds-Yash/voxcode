<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="480" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  
  <text x="550" y="45" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">System Architecture &amp; Data Pipeline</text>
  <text x="550" y="70" fill="#64748b" font-family="sans-serif" font-size="13" text-anchor="middle">From Voice Ingestion &amp; AST Codebase Indexing to Validated Code Patches</text>

  <!-- Step 1: Voice / Audio Ingestion -->
  <g transform="translate(60, 110)">
    <rect width="200" height="150" rx="10" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="100" cy="40" r="22" fill="#0369a1" opacity="0.5"/>
    <text x="100" y="46" fill="#38bdf8" font-family="sans-serif" font-size="20" text-anchor="middle">🎙️</text>
    <text x="100" y="85" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Voice &amp; Audio</text>
    <text x="100" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">16 kHz PCM Stream</text>
    <text x="100" y="130" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Faster-Whisper STT</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="260" y1="185" x2="310" y2="185" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="4 2"/>
  <polygon points="310,185 302,180 302,190" fill="#818cf8"/>

  <!-- Step 2: Codebase AST Indexer -->
  <g transform="translate(320, 110)">
    <rect width="200" height="150" rx="10" fill="url(#boxBg)" stroke="#818cf8" stroke-width="1.8"/>
    <circle cx="100" cy="40" r="22" fill="#4338ca" opacity="0.5"/>
    <text x="100" y="46" fill="#818cf8" font-family="sans-serif" font-size="20" text-anchor="middle">🌲</text>
    <text x="100" y="85" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">AST Code Parsing</text>
    <text x="100" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Symbol &amp; Scope Graphs</text>
    <text x="100" y="130" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Functions, Classes, Chunks</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="520" y1="185" x2="570" y2="185" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="4 2"/>
  <polygon points="570,185 562,180 562,190" fill="#818cf8"/>

  <!-- Step 3: Hybrid Retrieval & Reranker -->
  <g transform="translate(580, 110)">
    <rect width="200" height="150" rx="10" fill="url(#boxBg)" stroke="#a855f7" stroke-width="1.8"/>
    <circle cx="100" cy="40" r="22" fill="#6b21a8" opacity="0.5"/>
    <text x="100" y="46" fill="#c084fc" font-family="sans-serif" font-size="20" text-anchor="middle">⚡</text>
    <text x="100" y="85" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Hybrid Search &amp; Rerank</text>
    <text x="100" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">BM25 + Dense Vectors</text>
    <text x="100" y="130" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cross-Encoder Fusion</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="780" y1="185" x2="830" y2="185" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="4 2"/>
  <polygon points="830,185 822,180 822,190" fill="#818cf8"/>

  <!-- Step 4: Multi-Agent Coder & IDE Integration -->
  <g transform="translate(840, 110)">
    <rect width="200" height="150" rx="10" fill="url(#boxBg)" stroke="#22c55e" stroke-width="1.8"/>
    <circle cx="100" cy="40" r="22" fill="#15803d" opacity="0.5"/>
    <text x="100" y="46" fill="#4ade80" font-family="sans-serif" font-size="20" text-anchor="middle">🤖</text>
    <text x="100" y="85" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Agent &amp; VS Code</text>
    <text x="100" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Step Planner &amp; Coder</text>
    <text x="100" y="130" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Validated Diff Patch</text>
  </g>

  <!-- Lower summary row -->
  <g transform="translate(60, 310)">
    <rect width="980" height="120" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    
    <g transform="translate(40, 35)">
      <text x="0" y="0" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">⚡ Fast Local Execution</text>
      <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">Runs on Ollama, OpenAI, or local quantized models with sub-50ms retrieval latencies.</text>
    </g>

    <g transform="translate(380, 35)">
      <text x="0" y="0" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="bold">🔒 Private &amp; Air-Gappable</text>
      <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">Code never leaves your system when using local embeddings and offline LLMs.</text>
    </g>

    <g transform="translate(710, 35)">
      <text x="0" y="0" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold">🛡️ AST-Grounded Edits</text>
      <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">Symbol extraction prevents hallucinated functions and syntax degradation.</text>
    </g>
  </g>
</svg>