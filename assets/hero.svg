<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Grid -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- Sound Wave / Pulse Graphics -->
  <g transform="translate(600, 260)">
    <path d="M-500,0 Q-375,-40 -250,0 T0,0 T250,0 T500,0" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" opacity="0.4"/>
    <path d="M-500,0 Q-375,30 -250,0 T0,0 T250,0 T500,0" fill="none" stroke="url(#waveGrad)" stroke-width="2" opacity="0.3"/>
    <path d="M-400,0 Q-300,-70 -200,0 Q-100,70 0,0 Q100,-70 200,0 Q300,70 400,0" fill="none" stroke="url(#waveGrad)" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- Floating Audio Bars Indicator -->
  <g transform="translate(100, 100)">
    <rect x="0" y="30" width="6" height="40" rx="3" fill="#38bdf8"/>
    <rect x="12" y="15" width="6" height="70" rx="3" fill="#60a5fa"/>
    <rect x="24" y="0" width="6" height="100" rx="3" fill="#818cf8"/>
    <rect x="36" y="20" width="6" height="60" rx="3" fill="#a78bfa"/>
    <rect x="48" y="35" width="6" height="30" rx="3" fill="#c084fc"/>
  </g>

  <!-- Header & Title -->
  <g transform="translate(200, 110)">
    <rect x="0" y="-35" width="220" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="14" cy="-22" r="5" fill="#22c55e"/>
    <text x="26" y="-18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">VOICE-DRIVEN AI ENGINE</text>

    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Voice-Assisted Coding Agent
    </text>
    <text x="0" y="68" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
      Real-Time AST Codebase Indexing • Hybrid Retrieval • Multi-Agent Code Synthesis
    </text>
    <text x="0" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">
      Speak naturally to query your repository, refactor symbols, generate unit tests, and stream diffs.
    </text>
  </g>

  <!-- Right Side Visual / Chip -->
  <g transform="translate(1010, 80)">
    <rect width="130" height="130" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="65" cy="65" r="42" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6 4"/>
    <path d="M65,42 L65,72 M52,58 L65,72 L78,58" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="58" y="78" width="14" height="18" rx="2" fill="#818cf8"/>
    <text x="65" y="112" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AST ENGINE</text>
  </g>
</svg>