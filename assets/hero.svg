<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <style>
    :root { --panel: #f6f8fa; --panel-2: #ffffff; --ink: #0d1117; --muted: #57606a; --line: #d0d7de; --accent: #0969da; --accent-soft: #ddf4ff; --good: #1a7f37; }
    @media (prefers-color-scheme: dark) { :root { --panel: #0d1117; --panel-2: #161b22; --ink: #f0f6fc; --muted: #8b949e; --line: #30363d; --accent: #58a6ff; --accent-soft: #0c2d4a; --good: #3fb950; } }
    .sans { font-family: Geist, "Avenir Next", "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
    .reveal { opacity: 0; transform: translateY(10px); animation: reveal .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .r1 { animation-delay: .12s; } .r2 { animation-delay: .28s; } .r3 { animation-delay: .44s; } .r4 { animation-delay: .62s; }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.15s cubic-bezier(.55,0,.2,1) forwards; }
    .d1 { animation-delay: .22s; } .d2 { animation-delay: .4s; }
    .wave { stroke-dasharray: 8 12; animation: wave 2.1s linear infinite; }
    .flow { stroke-dasharray: 8 12; animation: wave 1.8s linear infinite; }
    .pulse-ring { animation: pulse-ring 2.8s cubic-bezier(.2,.72,.2,1) infinite; }
    .halo { animation: halo 3.4s cubic-bezier(.2,.72,.2,1) infinite; transform-origin: center; }
    .brand { animation: brand 5.2s infinite; }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    .rise { opacity: 0; transform: translateY(8px); animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .n1 { animation-delay: .12s; } .n2 { animation-delay: .3s; } .n3 { animation-delay: .48s; } .n4 { animation-delay: .7s; }
    .trace { stroke-dasharray: 7 10; animation: trace 2s linear infinite; }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes wave { to { stroke-dashoffset: -40; } }
    @keyframes pulse-ring { 0% { r: 8px; opacity: .65; stroke-width: 2px; } 72%, 100% { r: 18px; opacity: 0; stroke-width: 1px; } }
    @keyframes halo { 0% { opacity: .34; transform: scale(.88); } 72%, 100% { opacity: 0; transform: scale(1.18); } }
    @keyframes brand { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @keyframes trace { to { stroke-dashoffset: -34; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .reveal, .rise { opacity: 1; transform: translateY(0); } .draw { stroke-dashoffset: 0; } }
  </style>

  <!-- Background -->
  <rect x="2" y="2" width="1196" height="536" rx="28" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  
  <!-- Separators -->
  <line x1="2" y1="116" x2="1198" y2="116" stroke="var(--line)" stroke-width="2"/>
  <line x1="2" y1="458" x2="1198" y2="458" stroke="var(--line)" stroke-width="2"/>

  <!-- Top bar -->
  <circle cx="74" cy="64" r="6" fill="var(--accent)" class="blink" />
  <text x="96" y="70" class="mono reveal r1" fill="var(--muted)" font-size="14" font-weight="600" letter-spacing="1.5">VOX ACTIVE</text>
  
  <text x="1000" y="70" class="mono reveal r1" fill="var(--muted)" font-size="14" font-weight="600" letter-spacing="1.5" text-anchor="end">AI CODE ENGINE</text>
  <rect x="1040" y="52" width="46" height="26" rx="13" fill="var(--panel-2)" stroke="var(--line)"/>
  <text x="1063" y="70" class="mono reveal r1" fill="var(--ink)" font-size="14" font-weight="600" text-anchor="middle">v1</text>

  <!-- Left Content -->
  <text x="74" y="210" class="sans reveal r2" fill="var(--ink)" font-size="70" font-weight="800" letter-spacing="-2">voxcode</text>
  <text x="74" y="272" class="sans reveal r3" fill="var(--accent)" font-size="36" font-weight="600" letter-spacing="-0.5">voice → code</text>
  <text x="74" y="320" class="sans reveal r4" fill="var(--muted)" font-size="24" font-weight="500">Speak your intent. Get production-ready code.</text>

  <!-- Pills -->
  <g class="reveal r4">
    <rect x="74" y="370" width="160" height="42" rx="21" fill="var(--panel-2)" stroke="var(--line)"/>
    <text x="154" y="396" class="mono" fill="var(--ink)" font-size="14" font-weight="600" text-anchor="middle">AST INDEXING</text>
    
    <rect x="250" y="370" width="170" height="42" rx="21" fill="var(--panel-2)" stroke="var(--line)"/>
    <text x="335" y="396" class="mono" fill="var(--ink)" font-size="14" font-weight="600" text-anchor="middle">HYBRID SEARCH</text>
    
    <rect x="436" y="370" width="180" height="42" rx="21" fill="var(--panel-2)" stroke="var(--line)"/>
    <text x="526" y="396" class="mono" fill="var(--ink)" font-size="14" font-weight="600" text-anchor="middle">VOICE DICTATION</text>
  </g>

  <!-- Right Visual -->
  <g transform="translate(880, 270)">
    <circle cx="0" cy="0" r="132" fill="none" stroke="var(--accent)" stroke-width="2" class="halo" />
    <circle cx="0" cy="0" r="123" fill="var(--accent-soft)" opacity="0.2" />
    <g class="brand">
      <rect x="-80" y="-60" width="160" height="120" rx="12" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2" />
      <line x1="-50" y1="-20" x2="30" y2="-20" stroke="var(--line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
      <line x1="-50" y1="0" x2="50" y2="0" stroke="var(--line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 6 8 6"/>
      <line x1="-50" y1="20" x2="-10" y2="20" stroke="var(--line)" stroke-width="4" stroke-linecap="round" />
      <rect x="0" y="14" width="8" height="12" fill="var(--accent)" class="blink" />
    </g>
  </g>

  <!-- Bottom Bar -->
  <text x="74" y="500" class="mono reveal r4" fill="var(--muted)" font-size="13" font-weight="500">Python 3.7+ · BM25 + SEMANTIC · AST PARSER</text>
  
  <path d="M 880 500 Q 900 480 920 500 T 960 500 T 1000 500 T 1040 500 T 1080 500 T 1120 500" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" class="wave" opacity="0.6"/>
</svg>