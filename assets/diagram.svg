<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%" height="100%">
  <style>
    :root { --panel: #f6f8fa; --panel-2: #ffffff; --ink: #0d1117; --muted: #57606a; --line: #d0d7de; --accent: #0969da; --accent-soft: #ddf4ff; --good: #1a7f37; }
    @media (prefers-color-scheme: dark) { :root { --panel: #0d1117; --panel-2: #161b22; --ink: #f0f6fc; --muted: #8b949e; --line: #30363d; --accent: #58a6ff; --accent-soft: #0c2d4a; --good: #3fb950; } }
    .sans { font-family: Geist, "Avenir Next", "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
    .wave { stroke-dasharray: 8 12; animation: wave 2.1s linear infinite; }
    .flow { stroke-dasharray: 8 12; animation: wave 1.8s linear infinite; }
    .pulse-ring { animation: pulse-ring 2.8s cubic-bezier(.2,.72,.2,1) infinite; }
    .rise { opacity: 0; transform: translateY(8px); animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .n1 { animation-delay: .12s; } .n2 { animation-delay: .3s; } .n3 { animation-delay: .48s; } .n4 { animation-delay: .7s; }
    @keyframes wave { to { stroke-dashoffset: -40; } }
    @keyframes pulse-ring { 0% { r: 6px; opacity: .65; stroke-width: 2px; } 72%, 100% { r: 16px; opacity: 0; stroke-width: 1px; } }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise { opacity: 1; transform: translateY(0); } }
  </style>

  <rect x="2" y="2" width="1196" height="406" rx="24" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  
  <!-- Title bar -->
  <text x="52" y="54" class="mono" fill="var(--muted)" font-size="14" font-weight="600" letter-spacing="1.5">AGENT PIPELINE · VOICE → CODE</text>
  <text x="1148" y="54" class="mono" fill="var(--muted)" font-size="14" font-weight="600" letter-spacing="1.5" text-anchor="end">FIG. 01</text>

  <!-- Flow Arrows -->
  <g stroke="var(--line)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1 to 2 -->
    <path d="M 328 202 L 448 202" class="flow"/>
    <polygon points="440,196 452,202 440,208" fill="var(--line)" stroke="none"/>
    <!-- 2 to 3 -->
    <path d="M 732 202 L 852 202" class="flow"/>
    <polygon points="844,196 856,202 844,208" fill="var(--line)" stroke="none"/>
  </g>

  <!-- Card 1 -->
  <g class="rise n1" transform="translate(52, 100)">
    <rect x="0" y="0" width="276" height="204" rx="16" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/>
    <rect x="24" y="24" width="76" height="28" rx="14" fill="var(--accent-soft)"/>
    <text x="62" y="43" class="mono" fill="var(--accent)" font-size="12" font-weight="700" text-anchor="middle">LISTEN</text>
    <text x="24" y="88" class="sans" fill="var(--ink)" font-size="24" font-weight="700">Voice Capture</text>
    <text x="24" y="120" class="mono" fill="var(--muted)" font-size="13">Whisper STT · offline</text>
    <text x="24" y="144" class="mono" fill="var(--muted)" font-size="13">streaming buffer</text>
    <path d="M 24 180 Q 44 170 64 180 T 104 180 T 144 180" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" class="wave" opacity="0.7"/>
  </g>

  <!-- Card 2 -->
  <g class="rise n2" transform="translate(468, 100)">
    <rect x="0" y="0" width="264" height="204" rx="16" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/>
    <rect x="24" y="24" width="68" height="28" rx="14" fill="var(--accent-soft)"/>
    <text x="58" y="43" class="mono" fill="var(--accent)" font-size="12" font-weight="700" text-anchor="middle">THINK</text>
    <text x="24" y="88" class="sans" fill="var(--ink)" font-size="24" font-weight="700">Hybrid Search</text>
    <text x="24" y="120" class="mono" fill="var(--muted)" font-size="13">BM25 + dense vector</text>
    <text x="24" y="144" class="mono" fill="var(--muted)" font-size="13">AST symbol index</text>
    
    <line x1="24" y1="180" x2="240" y2="180" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="180" x2="160" y2="180" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="160" cy="180" r="6" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"/>
  </g>

  <!-- Card 3 -->
  <g class="rise n3" transform="translate(872, 100)">
    <rect x="0" y="0" width="276" height="204" rx="16" fill="var(--panel-2)" stroke="var(--line)" stroke-width="2"/>
    <rect x="24" y="24" width="90" height="28" rx="14" fill="var(--accent-soft)"/>
    <text x="69" y="43" class="mono" fill="var(--accent)" font-size="12" font-weight="700" text-anchor="middle">GENERATE</text>
    <text x="24" y="88" class="sans" fill="var(--ink)" font-size="24" font-weight="700">Code Output</text>
    <text x="24" y="120" class="mono" fill="var(--muted)" font-size="13">context-aware diff</text>
    <text x="24" y="144" class="mono" fill="var(--muted)" font-size="13">patch applied live</text>
    <g transform="translate(24, 180)">
      <circle cx="0" cy="0" r="6" fill="none" stroke="var(--good)" stroke-width="2" class="pulse-ring"/>
      <circle cx="0" cy="0" r="4" fill="var(--good)"/>
      <text x="16" y="4" class="mono" fill="var(--good)" font-size="12" font-weight="700">READY</text>
    </g>
    <circle cx="236" cy="164" r="16" fill="var(--accent-soft)"/>
    <path d="M 229 164 L 234 169 L 243 159" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom strip -->
  <g class="rise n4" transform="translate(0, 350)">
    <path d="M 52 10 L 1148 10" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="420" y="0" width="360" height="20" fill="var(--panel)"/>
    <text x="600" y="14" class="mono" fill="var(--muted)" font-size="13" font-weight="600" text-anchor="middle">INTENT UNCLEAR? → re-queries with expanded context</text>
  </g>
</svg>
