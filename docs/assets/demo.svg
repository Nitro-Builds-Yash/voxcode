<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="960" height="336" viewBox="0 0 960 336" role="img" aria-label="VoxCode command-line demo"><defs><style>@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120d0b"/><stop offset="1" stop-color="#211612"/></linearGradient><radialGradient id="glow" cx="0.9" cy="0.0" r="0.6"><stop offset="0" stop-color="#fb7185" stop-opacity="0.22"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/></pattern></defs><rect width="960" height="336" rx="16" fill="url(#bg)"/><rect width="960" height="336" rx="16" fill="url(#glow)"/><rect x="0.5" y="0.5" width="959" height="335" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.07"/><rect x="0" y="0" width="960" height="336" rx="16" fill="#1a1310" stroke="#3a2a22"/><path d="M0 40V16a16 16 0 0 1 16-16H944a16 16 0 0 1 16 16V40Z" fill="#241a15"/><circle cx="24" cy="20" r="6" fill="#f87171" fill-opacity="0.85"/><circle cx="44" cy="20" r="6" fill="#fbbf24" fill-opacity="0.85"/><circle cx="64" cy="20" r="6" fill="#6ee7b7" fill-opacity="0.85"/><text x="480.0" y="25" font-family="'JetBrains Mono', sans-serif" font-size="13" font-weight="400" fill="#9a8579" text-anchor="middle" letter-spacing="0" >~/projects/voxcode</text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.35s" fill="freeze"/><text x="36" y="82" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="700" fill="#9a8579" text-anchor="start" letter-spacing="0" >$ </text><text x="58" y="82" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="400" fill="#fff7ed" text-anchor="start" letter-spacing="0" >voxcode index .</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.10s" dur="0.35s" fill="freeze"/><text x="36" y="112" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="700" fill="#6ee7b7" text-anchor="start" letter-spacing="0" >✓ </text><text x="58" y="112" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >indexed 175 files · symbols, vectors and call graph ready</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.80s" dur="0.35s" fill="freeze"/><text x="36" y="142" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="700" fill="#9a8579" text-anchor="start" letter-spacing="0" >$ </text><text x="58" y="142" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="400" fill="#fff7ed" text-anchor="start" letter-spacing="0" >voxcode ask "how are patches validated?"</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.50s" dur="0.35s" fill="freeze"/><text x="36" y="172" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0" >› </text><text x="58" y="172" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >Every diff goes through git apply --check, then your tests</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.20s" dur="0.35s" fill="freeze"/><text x="36" y="202" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0" >  </text><text x="58" y="202" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >run in a sandbox copy (Docker when available). Failures are</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.90s" dur="0.35s" fill="freeze"/><text x="36" y="232" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="700" fill="#fb7185" text-anchor="start" letter-spacing="0" >  </text><text x="58" y="232" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >fed back for a repair pass. → execution/patch/patch_service.py</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.60s" dur="0.35s" fill="freeze"/><text x="36" y="262" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="700" fill="#9a8579" text-anchor="start" letter-spacing="0" >$ </text><text x="58" y="262" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="400" fill="#fff7ed" text-anchor="start" letter-spacing="0" >voxcode edit "add a docstring to reciprocal_rank_fusion" --tests</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.30s" dur="0.35s" fill="freeze"/><text x="36" y="292" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="700" fill="#6ee7b7" text-anchor="start" letter-spacing="0" >✓ </text><text x="58" y="292" font-family="'JetBrains Mono', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >plan → edit → tests passed · 1 file changed</text></g><rect x="36" y="307" width="10" height="20" rx="2" fill="#fbbf24"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></svg>
