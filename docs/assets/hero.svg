<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="VoxCode: talk to your codebase">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="1" stop-color="#121a36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>

  <!-- Logo: voice bars becoming code brackets -->
  <g transform="translate(72 92)">
    <rect width="64" height="64" rx="16" fill="url(#accent)"/>
    <g fill="#0a0f1f">
      <rect x="14" y="26" width="5" height="12" rx="2.5"/>
      <rect x="22" y="18" width="5" height="28" rx="2.5"/>
      <rect x="30" y="22" width="5" height="20" rx="2.5"/>
    </g>
    <path d="M41 22 L50 32 L41 42" fill="none" stroke="#0a0f1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="152" y="138" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-0.5">VoxCode</text>

  <text x="72" y="222" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Talk to your codebase.</text>
  <text x="72" y="268" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#a5b0d0">Ask questions out loud. Get grounded answers and</text>
  <text x="72" y="296" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#a5b0d0">patches that are checked before you see them.</text>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <g transform="translate(72 334)">
      <rect width="148" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="18" cy="16" r="4" fill="#22d3ee"/>
      <text x="30" y="21" fill="#dbe2f5">Voice in &amp; out</text>
    </g>
    <g transform="translate(230 334)">
      <rect width="148" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="18" cy="16" r="4" fill="#7c5cff"/>
      <text x="30" y="21" fill="#dbe2f5">Hybrid search</text>
    </g>
    <g transform="translate(388 334)">
      <rect width="160" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="18" cy="16" r="4" fill="#34d399"/>
      <text x="30" y="21" fill="#dbe2f5">Validated patches</text>
    </g>
  </g>

  <!-- Editor card -->
  <g transform="translate(676 58)" filter="url(#shadow)">
    <rect width="540" height="324" rx="14" fill="#0d1328" stroke="#ffffff" stroke-opacity="0.10"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 h512 a14 14 0 0 1 14 14 v22 h-540z" fill="#151d3b"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5" fill="#febc2e"/>
    <circle cx="56" cy="18" r="5" fill="#28c840"/>
    <text x="270" y="23" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#8a94b8">app/users.py · VoxCode</text>

    <!-- spoken request -->
    <g transform="translate(20 54)">
      <rect width="500" height="44" rx="10" fill="#7c5cff" fill-opacity="0.14" stroke="#7c5cff" stroke-opacity="0.45"/>
      <g transform="translate(16 12)" fill="#c4b5fd">
        <rect x="0" y="7" width="3.5" height="6" rx="1.75"/>
        <rect x="5.5" y="3" width="3.5" height="14" rx="1.75"/>
        <rect x="11" y="0" width="3.5" height="20" rx="1.75"/>
        <rect x="16.5" y="4" width="3.5" height="12" rx="1.75"/>
        <rect x="22" y="7" width="3.5" height="6" rx="1.75"/>
      </g>
      <text x="56" y="28" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#e9e5ff">“Validate the email in create_user”</text>
    </g>

    <!-- diff -->
    <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13.5" xml:space="preserve">
      <text x="24" y="128" fill="#6b7699">@@ -14,6 +14,8 @@ class UserService:</text>
      <text x="24" y="152" fill="#c9d1ea">     def create_user(self, email, name):</text>
      <rect x="20" y="161" width="500" height="22" fill="#34d399" fill-opacity="0.12"/>
      <text x="24" y="177" fill="#6ee7b7">+        if not EMAIL_RE.match(email):</text>
      <rect x="20" y="185" width="500" height="22" fill="#34d399" fill-opacity="0.12"/>
      <text x="24" y="201" fill="#6ee7b7">+            raise ValueError("invalid email")</text>
      <text x="24" y="225" fill="#c9d1ea">         user = User(email=email, name=name)</text>
    </g>

    <!-- checks -->
    <line x1="20" y1="246" x2="520" y2="246" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">
      <g transform="translate(24 262)">
        <circle cx="9" cy="9" r="9" fill="#34d399" fill-opacity="0.18"/>
        <path d="M5 9.5 l3 3 l6 -6.5" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="14" fill="#b7c0dc">git apply --check</text>
      </g>
      <g transform="translate(196 262)">
        <circle cx="9" cy="9" r="9" fill="#34d399" fill-opacity="0.18"/>
        <path d="M5 9.5 l3 3 l6 -6.5" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="14" fill="#b7c0dc">tests pass</text>
      </g>
      <g transform="translate(320 262)">
        <circle cx="9" cy="9" r="9" fill="#34d399" fill-opacity="0.18"/>
        <path d="M5 9.5 l3 3 l6 -6.5" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="26" y="14" fill="#b7c0dc">review approved</text>
      </g>
      <g transform="translate(24 290)">
        <rect width="74" height="24" rx="6" fill="url(#accent)"/>
        <text x="37" y="16.5" text-anchor="middle" fill="#0a0f1f" font-size="12.5">Accept</text>
        <rect x="84" width="70" height="24" rx="6" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
        <text x="119" y="16.5" text-anchor="middle" fill="#c9d1ea" font-size="12.5">Reject</text>
        <text x="170" y="16.5" fill="#6b7699" font-size="12.5" font-weight="400">or just say “accept”</text>
      </g>
    </g>
  </g>
</svg>
