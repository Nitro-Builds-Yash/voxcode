<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1272" height="488" viewBox="0 0 1272 488" role="img" aria-label="VoxCode features"><defs><style>@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Space Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style></defs><rect x="0" y="0" width="408" height="232" rx="18" fill="#1a1310" stroke="#3a2a22"/><rect x="24" y="0" width="64" height="3" rx="1.5" fill="#fbbf24"/><circle cx="50" cy="54" r="26" fill="#fbbf24" fill-opacity="0.13"/><text x="50" y="63" font-size="24" text-anchor="middle">🎙️</text><text x="90" y="62" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#fff7ed" text-anchor="start" letter-spacing="-0.3" >Voice-first</text><text x="26" y="120" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >Push-to-talk or hands-free with</text><text x="26" y="145" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >a wake word. Whisper runs locally;</text><text x="26" y="170" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >replies stream out loud and you</text><text x="26" y="195" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >can interrupt mid-sentence.</text><rect x="432" y="0" width="408" height="232" rx="18" fill="#1a1310" stroke="#3a2a22"/><rect x="456" y="0" width="64" height="3" rx="1.5" fill="#fb7185"/><circle cx="482" cy="54" r="26" fill="#fb7185" fill-opacity="0.13"/><text x="482" y="63" font-size="24" text-anchor="middle">🔎</text><text x="522" y="62" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#fff7ed" text-anchor="start" letter-spacing="-0.3" >Search that reads code</text><text x="458" y="120" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >tree-sitter symbols for 6 languages.</text><text x="458" y="145" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >BM25 + vectors, fused and reranked,</text><text x="458" y="170" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >expanded through a precise call</text><text x="458" y="195" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >graph and your git history.</text><rect x="864" y="0" width="408" height="232" rx="18" fill="#1a1310" stroke="#3a2a22"/><rect x="888" y="0" width="64" height="3" rx="1.5" fill="#6ee7b7"/><circle cx="914" cy="54" r="26" fill="#6ee7b7" fill-opacity="0.13"/><text x="914" y="63" font-size="24" text-anchor="middle">✅</text><text x="954" y="62" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#fff7ed" text-anchor="start" letter-spacing="-0.3" >Patches you can trust</text><text x="890" y="120" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >Plan → edit → test → repair.</text><text x="890" y="145" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >git apply --check, tests in a</text><text x="890" y="170" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >network-isolated sandbox, then</text><text x="890" y="195" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >you accept. Undo is one word.</text><rect x="0" y="256" width="408" height="232" rx="18" fill="#1a1310" stroke="#3a2a22"/><rect x="24" y="256" width="64" height="3" rx="1.5" fill="#fb923c"/><circle cx="50" cy="310" r="26" fill="#fb923c" fill-opacity="0.13"/><text x="50" y="319" font-size="24" text-anchor="middle">🦀</text><text x="90" y="318" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#fff7ed" text-anchor="start" letter-spacing="-0.3" >Rust-accelerated</text><text x="26" y="376" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >Search, scanning, redaction and</text><text x="26" y="401" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >voice detection in Rust: up to</text><text x="26" y="426" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >157× faster, identical results,</text><text x="26" y="451" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >pure-Python fallback.</text><rect x="432" y="256" width="408" height="232" rx="18" fill="#1a1310" stroke="#3a2a22"/><rect x="456" y="256" width="64" height="3" rx="1.5" fill="#e879f9"/><circle cx="482" cy="310" r="26" fill="#e879f9" fill-opacity="0.13"/><text x="482" y="319" font-size="24" text-anchor="middle">🔌</text><text x="522" y="318" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#fff7ed" text-anchor="start" letter-spacing="-0.3" >Any model</text><text x="458" y="376" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >Ollama (fully local), Anthropic,</text><text x="458" y="401" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >OpenAI, Gemini, Groq, OpenRouter.</text><text x="458" y="426" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >Tool calling, prompt caching,</text><text x="458" y="451" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >token and cost tracking.</text><rect x="864" y="256" width="408" height="232" rx="18" fill="#1a1310" stroke="#3a2a22"/><rect x="888" y="256" width="64" height="3" rx="1.5" fill="#7dd3fc"/><circle cx="914" cy="310" r="26" fill="#7dd3fc" fill-opacity="0.13"/><text x="914" y="319" font-size="24" text-anchor="middle">🔒</text><text x="954" y="318" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#fff7ed" text-anchor="start" letter-spacing="-0.3" >Private by default</text><text x="890" y="376" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >Localhost only. Secrets redacted</text><text x="890" y="401" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >before anything leaves. LOCAL_ONLY</text><text x="890" y="426" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >mode. Indexes live in ~/.voxcode,</text><text x="890" y="451" font-family="'Inter', sans-serif" font-size="15.5" font-weight="400" fill="#d6c4b8" text-anchor="start" letter-spacing="0" >never in your repository.</text></svg>
