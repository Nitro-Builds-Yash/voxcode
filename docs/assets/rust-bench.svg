<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Rust core speed-ups over pure Python">
<rect width="900" height="430" rx="14" fill="#0d1117" stroke="#30363d"/>
<defs><linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs>
<text x="32" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">🦀 Rust core vs pure Python</text>
<text x="868" y="42" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#8b949e">bar = time relative to Python · lower is faster</text>
<text x="32" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d1d9">BM25 search (4 queries)</text>
<rect x="340" y="78" width="410" height="12" rx="6" fill="#3776ab" fill-opacity="0.55"/>
<text x="760" y="89" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">43.2 ms</text>
<rect x="340" y="96" width="4.0" height="12" rx="6" fill="url(#r)"><animate attributeName="width" from="0" to="4.0" dur="1s" fill="freeze"/></rect>
<text x="354.0" y="107" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#fdba74">0.3 ms</text>
<text x="868" y="107" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fb923c">157×</text>
<text x="32" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d1d9">Build search index (20k chunks)</text>
<rect x="340" y="142" width="410" height="12" rx="6" fill="#3776ab" fill-opacity="0.55"/>
<text x="760" y="153" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">2,029.9 ms</text>
<rect x="340" y="160" width="81.0" height="12" rx="6" fill="url(#r)"><animate attributeName="width" from="0" to="81.0" dur="1s" fill="freeze"/></rect>
<text x="431.0" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#fdba74">401.0 ms</text>
<text x="868" y="171" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fb923c">5.1×</text>
<text x="32" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d1d9">Voice activity detection (60 s)</text>
<rect x="340" y="206" width="410" height="12" rx="6" fill="#3776ab" fill-opacity="0.55"/>
<text x="760" y="217" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">16.4 ms</text>
<rect x="340" y="224" width="32.5" height="12" rx="6" fill="url(#r)"><animate attributeName="width" from="0" to="32.5" dur="1s" fill="freeze"/></rect>
<text x="382.5" y="235" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#fdba74">1.3 ms</text>
<text x="868" y="235" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fb923c">12×</text>
<text x="32" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d1d9">Scan repository (175 files)</text>
<rect x="340" y="270" width="410" height="12" rx="6" fill="#3776ab" fill-opacity="0.55"/>
<text x="760" y="281" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">31.5 ms</text>
<rect x="340" y="288" width="82.0" height="12" rx="6" fill="url(#r)"><animate attributeName="width" from="0" to="82.0" dur="1s" fill="freeze"/></rect>
<text x="432.0" y="299" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#fdba74">6.3 ms</text>
<text x="868" y="299" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fb923c">5.0×</text>
<text x="32" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d1d9">Redact secrets (0.5 MB)</text>
<rect x="340" y="334" width="410" height="12" rx="6" fill="#3776ab" fill-opacity="0.55"/>
<text x="760" y="345" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">205.7 ms</text>
<rect x="340" y="352" width="104.6" height="12" rx="6" fill="url(#r)"><animate attributeName="width" from="0" to="104.6" dur="1s" fill="freeze"/></rect>
<text x="454.6" y="363" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#fdba74">52.5 ms</text>
<text x="868" y="363" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#fb923c">3.9×</text>
<rect x="32" y="398" width="14" height="10" rx="3" fill="#3776ab" fill-opacity="0.55"/><text x="52" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">Python</text>
<rect x="110" y="398" width="14" height="10" rx="3" fill="#f97316"/><text x="130" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">Rust (voxcode-native) · measured in CI on a 2-core GitHub runner</text>
</svg>
