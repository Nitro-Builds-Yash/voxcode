[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcode"
version = "0.9.0"
description = "Voice-driven coding agent with hybrid code search, validated patches and VS Code integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Athota Yashwanth" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core: API server, indexing, BM25 search, all LLM providers. Runs without
# any ML models (BM25-only search) so it installs quickly anywhere.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "qdrant-client>=1.10",
    "redis>=5.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.6",
    "watchdog>=4.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Semantic search + reranking (downloads models from Hugging Face on first use).
ml = ["sentence-transformers>=2.6", "transformers>=4.40", "torch>=2.2", "tiktoken>=0.7"]
# Speech-to-text, push-to-talk and text-to-speech.
voice = ["faster-whisper>=1.0", "sounddevice>=0.4.6", "pyttsx3>=2.90", "piper-tts>=1.2"]
# "Hey Vox"-style wake word for hands-free listening.
wakeword = ["openwakeword>=0.6"]
# Model Context Protocol server (`voxcode mcp`).
mcp = ["mcp>=2.0"]
# Precise Python call graph.
analysis = ["jedi>=0.19"]
# OpenTelemetry tracing (OTEL_ENABLED=true).
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]
# Rust acceleration (tokenizer, BM25, scanner, redaction, VAD). Build from
# source with `pip install ./native` until wheels are on PyPI.
native = ["voxcode-native>=0.6"]
all = ["voxcode[ml,voice,mcp,analysis]"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7", "mcp>=2.0", "jedi>=0.19"]

[project.scripts]
voxcode = "voxcode.cli:main"

[tool.setuptools.packages.find]
include = ["voxcode*"]

[tool.setuptools.package-data]
"voxcode.ui" = ["*.html"]
"voxcode.evaluation" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that exercise the HTTP API end to end"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["docs/interview/generate_interview_guide.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Sets VOXCODE_HOME before importing voxcode.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
files = ["voxcode"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
