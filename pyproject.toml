[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcode"
version = "0.1.0"
description = "Voice-assisted AI coding agent with hybrid retrieval, AST code intelligence, and VS Code integration."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Athota Yashwanth" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.8.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.6.0",
    "openai>=1.20.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
]
gpu = [
    "torch>=2.4.0",
    "accelerate>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
voxcode = "backend.main:main"
