# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up                          VoxCode + Redis + Qdrant
#   docker compose -f deploy/docker-compose.yml --profile observability up      + Jaeger traces (localhost:16686),
#                                                                          Prometheus and Grafana (localhost:3000, admin/admin)
# Set OTEL_ENABLED=true in .env to send traces.
services:
  voxcode:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: voxcode
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ../.env
        required: false
    environment:
      HOST: 0.0.0.0
      QDRANT_MODE: server
      QDRANT_HOST: qdrant
      MEMORY_BACKEND: redis
      REDIS_HOST: redis
      OLLAMA_HOST: http://host.docker.internal:11434
      # Only folders under /workspace can be indexed from inside the container.
      ALLOWED_REPO_ROOTS: /workspace
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - ${WORKSPACE_DIR:-../examples}:/workspace
      - voxcode_data:/root/.voxcode
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  voxcode_data:
  hf_cache:
  qdrant_data:
  redis_data:
