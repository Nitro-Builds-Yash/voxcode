name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev, no ML models)
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
      - name: Retrieval benchmark (BM25)
        run: voxcode eval

  answer-quality:
    # LLM-judged answers; runs only when an Anthropic key is configured.
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEFAULT_PROVIDER: anthropic
      RERANK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
      - uses: actions/setup-python@v5
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          python-version: "3.12"
          cache: pip
      - if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: pip install -e ".[dev]" && voxcode eval --answers
      - if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "ANTHROPIC_API_KEY secret not set; skipping answer-quality eval"

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run compile
