name: Release

# Push a tag like v0.5.0 to publish:
#  - the Python package to PyPI (trusted publishing: add this repo as a
#    publisher at https://pypi.org/manage/account/publishing/ first)
#  - the VS Code extension to the Marketplace (needs a VSCE_PAT secret) and
#    Open VSX (needs an OVSX_PAT secret); steps are skipped without them
#  - both artifacts to a GitHub release
on:
  push:
    tags: ["v*"]

jobs:
  python-package:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  vscode-extension:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run compile
      - run: npx --yes @vscode/vsce package -o voxcode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-extension/voxcode.vsix
      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --packagePath voxcode.vsix
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish voxcode.vsix -p "$OVSX_PAT"

  github-release:
    needs: [python-package, vscode-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/python-dist/*
            artifacts/vsix/voxcode.vsix
