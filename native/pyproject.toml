[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "voxcode-native"
version = "0.6.0"
description = "Optional Rust acceleration for VoxCode"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
features = ["python"]
module-name = "voxcode_native"
