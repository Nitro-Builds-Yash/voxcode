services:
  voxcode:
    build: .
    container_name: voxcode
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      QDRANT_MODE: server
      QDRANT_HOST: qdrant
      MEMORY_BACKEND: redis
      REDIS_HOST: redis
      OLLAMA_HOST: http://host.docker.internal:11434
      # Only folders under /workspace can be indexed from inside the container.
      ALLOWED_REPO_ROOTS: /workspace
    volumes:
      - ${WORKSPACE_DIR:-./examples}:/workspace
      - voxcode_data:/root/.voxcode
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  voxcode_data:
  hf_cache:
  qdrant_data:
  redis_data:
